interface:
  display_name: "Software Copyright Materials"
  short_description: "Generate Chinese software copyright application materials (code material, manual, application form, DOCX) from a real project."
  default_prompt: "为项目生成软著申请资料：程序鉴别材料（前30+后30页代码）、操作手册、申请表信息与正式 Word 材料。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    claude: "native"
    generic: "metadata-adapter"
